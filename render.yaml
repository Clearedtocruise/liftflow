# Render Blueprint — LiftFlow API
# Deploy: https://render.com/deploy?repo=https://github.com/Clearedtocruise/liftflow

services:
  - type: web
    name: liftflow-api
    runtime: node
    repo: https://github.com/Clearedtocruise/liftflow
    branch: main
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FOUNDER_ADMIN_KEY
        sync: false
      - key: RATE_LIMIT_MAX_PER_MINUTE
        value: '120'
      - key: AI_RATE_LIMIT_MAX_PER_MINUTE
        value: '15'
