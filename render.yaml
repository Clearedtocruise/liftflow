# Render Blueprint — LiftFlow API
# Deploy: https://render.com/deploy?repo=https://github.com/Clearedtocruise/liftflow

services:
  - type: web
    name: liftflow-api
    runtime: node
    repo: https://github.com/Clearedtocruise/liftflow
    branch: main
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
