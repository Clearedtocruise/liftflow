appId: com.liftflow.app
---
# Prerequisites: signed-in user with onboarding complete (dev client or TestFlight).
# Run: npm run qa:smoke

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 45000

- assertVisible:
    id: home-screen

- tapOn:
    id: workout-tab

- extendedWaitUntil:
    visible:
      id: weekly-plan
    timeout: 30000

- assertVisible:
    id: weekly-plan

- tapOn:
    id: nutrition-tab

- extendedWaitUntil:
    visible:
      id: nutrition-screen
    timeout: 30000

- assertVisible:
    id: nutrition-screen

- assertVisible:
    id: meal-list
    optional: true

- tapOn:
    id: settings-tab

- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 30000

- assertVisible:
    id: settings-screen
